<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>milestones.io | Countdown Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --serif: "Playfair Display", Georgia, "Times New Roman", serif;
      --glass-bg: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 16px 38px rgba(25, 26, 13, 0.28);
      --text: #fff8ef;
      --muted: rgba(255, 245, 224, 0.78);
      --accent: #f4c96f;
      --accent-glow: 0 0 0 1px rgba(244, 201, 111, 0.7), 0 0 22px rgba(244, 201, 111, 0.38);
      --badge-work: #d99f49;
      --badge-personal: #87a65a;
      --badge-travel: #52999b;
      --bg-1: #4f6529;
      --bg-2: #70893b;
      --bg-3: #c08f42;
      --bg-4: #3f7676;
    }

    body.twilight {
      --glass-bg: rgba(114, 85, 152, 0.22);
      --glass-border: rgba(255, 255, 255, 0.15);
      --card-shadow: 0 18px 36px rgba(11, 5, 23, 0.52);
      --text: #f8eeff;
      --muted: rgba(226, 201, 255, 0.78);
      --accent: #f5a1ff;
      --accent-glow: 0 0 0 1px rgba(245, 161, 255, 0.74), 0 0 22px rgba(245, 161, 255, 0.46);
      --badge-work: #f58abf;
      --badge-personal: #b88eff;
      --badge-travel: #7ea4ff;
      --bg-1: #3d144c;
      --bg-2: #5b1f7a;
      --bg-3: #31104a;
      --bg-4: #120a2a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--text);
      background: linear-gradient(145deg, var(--bg-1), var(--bg-2) 34%, var(--bg-3) 67%, var(--bg-4));
      transition: background 0.5s ease, color 0.5s ease;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    body::before {
      background:
        radial-gradient(circle at 20% 20%, rgba(252, 220, 131, 0.38), transparent 38%),
        radial-gradient(circle at 75% 15%, rgba(180, 210, 116, 0.3), transparent 34%),
        radial-gradient(circle at 60% 85%, rgba(65, 139, 127, 0.24), transparent 38%);
      opacity: 1;
    }

    body::after {
      background:
        linear-gradient(to top, rgba(17, 25, 14, 0.42), transparent 36%),
        radial-gradient(circle at 78% 22%, rgba(255, 188, 95, 0.24), transparent 44%);
      mix-blend-mode: screen;
      opacity: 1;
    }

    body.twilight::before {
      background:
        radial-gradient(circle at 78% 18%, rgba(245, 137, 247, 0.28), transparent 35%),
        radial-gradient(circle at 18% 80%, rgba(92, 121, 255, 0.22), transparent 36%),
        linear-gradient(to top, rgba(8, 6, 20, 0.8), transparent 45%);
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 18px;
      z-index: 10;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text);
      border-radius: 99px;
      padding: 10px 14px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      cursor: pointer;
      font: 600 0.82rem var(--sans);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--card-shadow);
    }

    .dashboard {
      width: min(1150px, calc(100% - 40px));
      margin: 64px auto 28px;
      position: relative;
      z-index: 1;
    }

    .glass {
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--card-shadow);
      border-radius: 20px;
    }

    .topbar {
      padding: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .brand {
      font-weight: 700;
      letter-spacing: 0.02em;
      font-size: 1.12rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      justify-content: flex-end;
      flex: 1;
    }

    select,
    .btn,
    .chip {
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 8px 12px;
      font: 600 0.75rem var(--sans);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .chip { cursor: pointer; }
    .chip.active,
    .btn.active,
    .btn:hover,
    .chip:hover,
    select:focus {
      outline: none;
      box-shadow: var(--accent-glow);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(280px, 1.2fr) 1fr;
      gap: 16px;
    }

    .featured-wrap,
    .list-wrap { min-height: 360px; }

    .cards { display: grid; gap: 12px; }

    .event-card {
      padding: 14px;
      border-radius: 18px;
      position: relative;
      display: grid;
      gap: 10px;
    }

    .event-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 8px;
    }

    .event-title { margin: 0; font: 700 1rem var(--sans); }
    .event-date { font-size: 0.78rem; color: var(--muted); }

    .badge {
      border-radius: 999px;
      padding: 4px 10px;
      font: 700 0.65rem var(--sans);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
    }

    .badge.work { background: var(--badge-work); }
    .badge.personal { background: var(--badge-personal); }
    .badge.travel { background: var(--badge-travel); }

    .timer {
      font: 700 1.5rem/1.1 var(--serif);
      letter-spacing: 0.04em;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .labels {
      display: flex;
      gap: 14px;
      font: 700 0.58rem var(--sans);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border-radius: 10px;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .featured-card {
      height: 100%;
      padding: 22px;
      display: grid;
      align-content: space-between;
      gap: 18px;
    }

    .featured-card .event-title { font-size: 1.6rem; }
    .featured-card .timer { font-size: clamp(1.8rem, 5vw, 2.7rem); }

    .empty {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .add-panel {
      margin-top: 16px;
      padding: 14px;
      display: none;
      gap: 10px;
      grid-template-columns: 2fr 1.6fr 1fr auto;
    }

    .add-panel.active { display: grid; }

    .add-panel input,
    .add-panel select {
      min-width: 0;
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 10px;
      font: 500 0.88rem var(--sans);
    }

    @media (max-width: 940px) {
      .grid { grid-template-columns: 1fr; }
      .add-panel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">🌲☀️ Warm Nature</button>

  <main class="dashboard">
    <section class="topbar glass">
      <div class="brand">milestones.io</div>
      <div class="controls">
        <select id="sortSelect" aria-label="Sort events">
          <option value="closest">Closest</option>
          <option value="furthest">Furthest</option>
          <option value="az">A-Z</option>
        </select>
        <button class="chip active" data-filter="all" type="button">All</button>
        <button class="chip" data-filter="work" type="button">Work</button>
        <button class="chip" data-filter="personal" type="button">Personal</button>
        <button class="chip" data-filter="travel" type="button">Travel</button>
        <button id="manualBtn" class="btn" type="button">Manual Re-order</button>
        <button id="addBtn" class="btn active" type="button">+ Add Event</button>
      </div>
    </section>

    <section id="addPanel" class="add-panel glass">
      <input id="eventTitle" type="text" placeholder="Event title" maxlength="60" />
      <input id="eventDate" type="datetime-local" />
      <select id="eventCategory">
        <option value="work">Work</option>
        <option value="personal">Personal</option>
        <option value="travel">Travel</option>
      </select>
      <button id="saveEvent" class="btn active" type="button">Save</button>
    </section>

    <section class="grid">
      <article id="featuredWrap" class="featured-wrap glass"></article>
      <article class="list-wrap">
        <div id="cards" class="cards"></div>
      </article>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "milestones-dashboard-events-v1";
    const PREFS_KEY = "milestones-dashboard-prefs-v1";

    const VALID_CATEGORIES = ["work", "personal", "travel"];
    const initialEvents = [
      { id: crypto.randomUUID(), title: "Product Launch", category: "work", target: "2026-12-15T09:00" },
      { id: crypto.randomUUID(), title: "Mountain Getaway", category: "travel", target: "2026-11-02T07:00" },
      { id: crypto.randomUUID(), title: "Mom's Birthday", category: "personal", target: "2026-10-21T00:00" }
    ];

    let events = [];
    let prefs = { theme: "warm", filter: "all", sort: "closest", manual: false, showAdd: false };

    const el = {
      themeToggle: document.getElementById("themeToggle"),
      sortSelect: document.getElementById("sortSelect"),
      cards: document.getElementById("cards"),
      featuredWrap: document.getElementById("featuredWrap"),
      chips: Array.from(document.querySelectorAll(".chip")),
      manualBtn: document.getElementById("manualBtn"),
      addBtn: document.getElementById("addBtn"),
      addPanel: document.getElementById("addPanel"),
      eventTitle: document.getElementById("eventTitle"),
      eventDate: document.getElementById("eventDate"),
      eventCategory: document.getElementById("eventCategory"),
      saveEvent: document.getElementById("saveEvent")
    };

    function normalizeCategory(category) {
      return VALID_CATEGORIES.includes(category) ? category : "personal";
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>'"]/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        "\"": "&quot;"
      }[char]));
    }

    function loadState() {
      const storedEvents = localStorage.getItem(STORAGE_KEY);
      const storedPrefs = localStorage.getItem(PREFS_KEY);
      events = storedEvents ? JSON.parse(storedEvents) : initialEvents;
      events = events
        .filter((event) => event && event.id && event.title && event.target)
        .map((event) => ({ ...event, category: normalizeCategory(event.category) }));
      prefs = storedPrefs ? { ...prefs, ...JSON.parse(storedPrefs) } : prefs;
      prefs.filter = ["all", ...VALID_CATEGORIES].includes(prefs.filter) ? prefs.filter : "all";
      prefs.sort = ["closest", "furthest", "az"].includes(prefs.sort) ? prefs.sort : "closest";
      prefs.manual = Boolean(prefs.manual);
      prefs.showAdd = Boolean(prefs.showAdd);
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
    }

    function setTheme(theme) {
      prefs.theme = theme;
      document.body.classList.toggle("twilight", theme === "twilight");
      el.themeToggle.textContent = theme === "twilight" ? "🏙️🌙 Twilight City" : "🌲☀️ Warm Nature";
      saveState();
    }

    function msToParts(ms) {
      if (ms <= 0) return null;
      const s = Math.floor(ms / 1000);
      const days = Math.floor(s / 86400);
      const hours = Math.floor((s % 86400) / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      return [days, hours, mins, secs].map((v) => String(v).padStart(2, "0"));
    }

    function filteredEvents() {
      let list = events.filter((e) => prefs.filter === "all" || e.category === prefs.filter);
      if (!prefs.manual) {
        const sorter = {
          closest: (a, b) => new Date(a.target) - new Date(b.target),
          furthest: (a, b) => new Date(b.target) - new Date(a.target),
          az: (a, b) => a.title.localeCompare(b.title)
        }[prefs.sort];
        list = [...list].sort(sorter);
      }
      return list;
    }

    function dateText(value) {
      return new Date(value).toLocaleString(undefined, {
        year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
      });
    }

    function timerHtml(target) {
      const parts = msToParts(new Date(target) - Date.now());
      if (!parts) return `<div class="timer">Completed</div>`;
      return `
        <div class="timer">${parts[0]} : ${parts[1]} : ${parts[2]} : ${parts[3]}</div>
        <div class="labels"><span>Days</span><span>Hours</span><span>Mins</span><span>Secs</span></div>
      `;
    }

    function moveEvent(id, dir) {
      const index = events.findIndex((e) => e.id === id);
      if (index < 0) return;
      const next = index + dir;
      if (next < 0 || next >= events.length) return;
      [events[index], events[next]] = [events[next], events[index]];
      saveState();
      render();
    }

    function deleteEvent(id) {
      events = events.filter((e) => e.id !== id);
      saveState();
      render();
    }

    function createCard(event, featured = false) {
      const card = document.createElement("section");
      card.className = `event-card glass${featured ? " featured-card" : ""}`;
      card.innerHTML = `
        <div class="actions">
          ${prefs.manual ? `<button class="icon-btn" data-move="up" aria-label="Move up">↑</button><button class="icon-btn" data-move="down" aria-label="Move down">↓</button>` : ""}
          <button class="icon-btn" data-del="1" aria-label="Delete">🗑</button>
        </div>
        <div class="event-head">
          <div>
            <h3 class="event-title">${escapeHtml(event.title)}</h3>
            <div class="event-date">${dateText(event.target)}</div>
          </div>
          <span class="badge ${normalizeCategory(event.category)}">${escapeHtml(normalizeCategory(event.category))}</span>
        </div>
        <div>${timerHtml(event.target)}</div>
      `;

      card.querySelectorAll("[data-move]").forEach((btn) => {
        btn.addEventListener("click", () => moveEvent(event.id, btn.dataset.move === "up" ? -1 : 1));
      });
      card.querySelector("[data-del]").addEventListener("click", () => deleteEvent(event.id));
      return card;
    }

    function render() {
      const list = filteredEvents();
      el.cards.innerHTML = "";
      el.featuredWrap.innerHTML = "";
      if (!list.length) {
        const empty = document.createElement("div");
        empty.className = "empty glass";
        empty.textContent = "No events for this category yet.";
        el.cards.appendChild(empty);
        el.featuredWrap.innerHTML = `<div class="empty">No featured event</div>`;
      } else {
        el.featuredWrap.appendChild(createCard(list[0], true));
        list.slice(1).forEach((event) => el.cards.appendChild(createCard(event)));
      }

      el.chips.forEach((chip) => chip.classList.toggle("active", chip.dataset.filter === prefs.filter));
      el.sortSelect.value = prefs.sort;
      el.manualBtn.classList.toggle("active", prefs.manual);
      el.addPanel.classList.toggle("active", prefs.showAdd);
    }

    function addEvent() {
      const title = el.eventTitle.value.trim();
      const target = el.eventDate.value;
      const category = normalizeCategory(el.eventCategory.value);
      if (!title || !target) return;
      events.push({ id: crypto.randomUUID(), title, target, category });
      el.eventTitle.value = "";
      el.eventDate.value = "";
      prefs.showAdd = false;
      saveState();
      render();
    }

    function wire() {
      el.themeToggle.addEventListener("click", () => setTheme(prefs.theme === "warm" ? "twilight" : "warm"));
      el.sortSelect.addEventListener("change", () => { prefs.sort = el.sortSelect.value; saveState(); render(); });
      el.chips.forEach((chip) => chip.addEventListener("click", () => { prefs.filter = chip.dataset.filter; saveState(); render(); }));
      el.manualBtn.addEventListener("click", () => { prefs.manual = !prefs.manual; saveState(); render(); });
      el.addBtn.addEventListener("click", () => { prefs.showAdd = !prefs.showAdd; saveState(); render(); });
      el.saveEvent.addEventListener("click", addEvent);
    }

    function init() {
      loadState();
      setTheme(prefs.theme || "warm");
      wire();
      render();
      setInterval(render, 1000);
    }

    init();
  </script>
</body>
</html>
